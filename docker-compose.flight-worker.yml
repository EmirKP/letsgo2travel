services:
  flight-worker:
    build:
      context: ./flight-worker
    container_name: letsgo2travel-flight-worker
    restart: unless-stopped
    env_file:
      - .env.flight-worker
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

