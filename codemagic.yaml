workflows:
  letsgo2travel-ios:
    name: LetsGo2Travel iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: LetsGo2Travel

    environment:
      groups:
        - letsgo2travel_public
      node: latest
      xcode: latest
      ios_signing:
        distribution_type: app_store
        # RESMÎ Codemagic davranışı (docs.codemagic.io/yaml-code-signing/signing-ios):
        # temel bundle identifier verildiğinde nokta ekli UZANTILAR da
        # (örn. tr.com.letsgo2travel.app.FlightActivityWidget) eşlenir;
        # joker desen gerekmez ve belgelenmemiştir.
        bundle_identifier: tr.com.letsgo2travel.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/org.swift.swiftpm

    scripts:
      - name: Install dependencies
        script: |
          npm ci
          npm --prefix mobile ci

      - name: Validate public mobile configuration
        script: |
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL is missing from letsgo2travel_public"
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY is missing from letsgo2travel_public"
            exit 1
          fi

      - name: Build mobile app and sync iOS
        script: |
          npm run mobile:prepare:ios

      - name: Set TestFlight re-upload build number
        script: |
          sed -i '' 's/CURRENT_PROJECT_VERSION = 22;/CURRENT_PROJECT_VERSION = 23;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Apply App Store signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
